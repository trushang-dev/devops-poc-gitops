# M6 demo only: represents non-sensitive configuration for a FUTURE database
# (e.g. RDS/PostgreSQL) that product-service does not yet connect to.
# Values are placeholders to demonstrate Kubernetes configuration management.
apiVersion: v1
kind: ConfigMap
metadata:
  name: product-service-db-config
  namespace: devops-poc
  labels:
    app: product-service
data:
  DB_HOST: "demo-product-db.invalid"
  DB_PORT: "5432"
  DB_NAME: "products_db_demo"
