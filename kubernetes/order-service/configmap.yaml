# M6 demo only: represents non-sensitive configuration for a FUTURE database
# (e.g. RDS/PostgreSQL) that order-service does not yet connect to.
# Values are placeholders to demonstrate Kubernetes configuration management.
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-db-config
  namespace: devops-poc
  labels:
    app: order-service
data:
  DB_HOST: "demo-order-db.invalid"
  DB_PORT: "5432"
  DB_NAME: "orders_db_demo"
