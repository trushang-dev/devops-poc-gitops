# Path-based Ingress exposing Grafana and Prometheus through the same
# shared NGINX Ingress Controller/IP the application API already uses
# (http://192.168.49.2), rather than a separate NodePort or subdomain -
# this is a local Minikube POC with a single external IP and no DNS.
#
# No rewrite-target is used on either rule: both Grafana and Prometheus
# are configured (see helm/monitoring/kube-prometheus-stack-values.yaml)
# to serve their entire UI/API themselves under their own /grafana or
# /prometheus prefix, so the Ingress only needs to forward the matching
# path prefix through unchanged.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: devops-monitoring
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-grafana
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-ingress
  namespace: devops-monitoring
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /prometheus
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-prometheus
                port:
                  number: 9090
