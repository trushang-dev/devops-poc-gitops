{{- range .Values.services }}
# M6 DEMO SECRET ONLY - NOT REAL CREDENTIALS.
#
# This Secret exists solely to demonstrate how Kubernetes would supply
# sensitive configuration (e.g. future RDS/PostgreSQL credentials) to a
# pod without hardcoding it into the application image or Deployment.
# {{ .name }} does NOT connect to any database - these values are
# never read by application code.
#
# A Kubernetes Secret is base64-encoded, NOT encrypted, and is not by
# itself production-grade secret management. Do not put real credentials
# here or in any file in this repository.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}-db-secret
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ .name }}
type: Opaque
stringData:
  DB_USER: {{ .db.user | quote }}
  DB_PASSWORD: {{ .db.password | quote }}
---
{{- end }}
