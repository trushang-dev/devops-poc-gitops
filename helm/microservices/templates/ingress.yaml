{{- range .Values.services }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .name }}-ingress
  namespace: {{ $.Values.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /{{ .apiPath }}/$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/{{ .apiPath }}(?!/health(/|$))(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .name }}
                port:
                  number: {{ .port }}
---
{{- end }}
{{- range .Values.services }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .name }}-health-ingress
  namespace: {{ $.Values.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /health
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/{{ .apiPath }}/health
            pathType: Exact
            backend:
              service:
                name: {{ .name }}
                port:
                  number: {{ .port }}
---
{{- end }}
